apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: officecli-platform-postgres
  namespace: officecli
spec:
  serviceName: officecli-platform-postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: officecli-platform-postgres
  template:
    metadata:
      labels:
        app: officecli-platform-postgres
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: officecli-platform-postgres
          args:
            - "-c"
            - "timezone=UTC"
            - "-c"
            - "wal_level=replica"
            - "-c"
            - "max_connections=200"
            - "-c"
            - "shared_buffers=256MB"
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
