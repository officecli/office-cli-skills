services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: officecli
      POSTGRES_PASSWORD: officecli
      POSTGRES_DB: officecli_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7.4
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
volumes:
  postgres_data:
  redis_data:
