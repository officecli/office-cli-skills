    <script type="application/ld+json" data-route-jsonld="1">
      {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What makes OfficeCLI different from other AI document CLIs?","acceptedAnswer":{"@type":"Answer","text":"OfficeCLI ships an end-to-end publish path. Every successful PPTX, DOCX, XLSX, REPORT, or standalone IMG generation can be turned into a password-protected online preview link with one command — no extra hosting, gateway, or upload step. Toggle per command with `--no-publish` or globally via `officecli config set-publish`. Other terminal-first AI document generators stop at a local file."}},{"@type":"Question","name":"How does one-command online publish work?","acceptedAnswer":{"@type":"Answer","text":"After a successful generation, OfficeCLI calls the OfficeCLI publish service, returns a shareable `officecli.io/p/<id>` URL, and prints an auto-generated access password protecting the preview. Run `officecli config set-publish` once to enable the channel; subsequent `officecli new ...` runs publish by default for documents and standalone images. Add `--no-publish` to keep any single run fully local. Set `OFFICE_CLI_DEFAULT_PUBLISH=false` to flip the default for batch jobs."}},{"@type":"Question","name":"Is OfficeCLI only for generating files?","acceptedAnswer":{"@type":"Answer","text":"No. Generation is the primary focus right now, but the product direction is broader document operations: standalone image generation, conversion, content modification, summarization, extraction, and layout handling."}},{"@type":"Question","name":"Do I need Docker, Kubernetes, or a backend?","acceptedAnswer":{"@type":"Answer","text":"Not for the core local workflow. OfficeCLI is designed to stay lightweight: one binary plus your LLM endpoint. Platform features are optional, not a requirement for basic local use. Standalone IMG generation does call the OfficeCLI image service for license-aware quota."}},{"@type":"Question","name":"What document types work today?","acceptedAnswer":{"@type":"Answer","text":"The current public release generates PPTX, DOCX, XLSX, workbook-backed REPORT outputs, and standalone IMG visuals via `new img`. It can also score and review local PPTX files, and publish any of those outputs as a password-protected online preview link with one command."}},{"@type":"Question","name":"How does standalone image generation work?","acceptedAnswer":{"@type":"Answer","text":"`officecli new img` calls the OfficeCLI image service, supports `--ratio square|landscape|portrait`, an explicit `--size <WxH>`, and one or more `--reference-image` inputs. A separate free image bucket of 3 images per user per day is tracked independently from the document bucket, and successful images publish online previews by default when publishing is configured."}},{"@type":"Question","name":"Do I need LibreOffice or Microsoft Office installed?","acceptedAnswer":{"@type":"Answer","text":"Not for generation. PPTX review can run structural checks without extra tools. If soffice is installed, OfficeCLI can add a stronger visual review pass."}},{"@type":"Question","name":"What install options are supported?","acceptedAnswer":{"@type":"Answer","text":"Homebrew, npm, the official install script, and manual release binaries are all supported on macOS and Linux for x64 and arm64."}},{"@type":"Question","name":"When do I need platform.officecli.io?","acceptedAnswer":{"@type":"Answer","text":"Use the platform when you need paid access management, billing, API-key workflows, image-quota monitoring, or to inspect, revoke, and manage published online previews from a UI."}}]}
