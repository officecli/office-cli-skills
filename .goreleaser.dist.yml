version: 2

project_name: officecli

before:
  hooks:
    - go test ./...

builds:
  - id: officecli
    main: ./cmd/officecli
    binary: officecli
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/officecli/officecli-internal/internal/cli.Version={{ .Version }}
      - -X github.com/officecli/officecli-internal/internal/cli.Commit={{ .Commit }}
      - -X github.com/officecli/officecli-internal/internal/cli.BuildDate={{ .Date }}
      - -X github.com/officecli/officecli-internal/internal/license.EmbeddedLicenseProofPublicKey={{ .Env.CLI_LICENSE_PROOF_PUBLIC_KEY }}
      - -X github.com/officecli/officecli-internal/internal/providers/publish.EmbeddedPublishBaseURL={{ .Env.CLI_EMBEDDED_PUBLISH_BASE_URL }}
      - -X github.com/officecli/officecli-internal/internal/providers/publish.EmbeddedPublishAuthKeyID={{ .Env.CLI_EMBEDDED_PUBLISH_AUTH_KEY_ID }}
      - -X github.com/officecli/officecli-internal/internal/providers/publish.EmbeddedPublishAuthKey={{ .Env.CLI_EMBEDDED_PUBLISH_AUTH_KEY }}

archives:
  - id: officecli
    ids:
      - officecli
    formats:
      - tar.gz
    name_template: >-
      officecli_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

release:
  github:
    owner: "{{ .Env.PUBLIC_DIST_REPO_OWNER }}"
    name: "{{ .Env.PUBLIC_DIST_REPO_NAME }}"
  draft: false
  prerelease: auto
  replace_existing_draft: true

changelog:
  disable: false
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
