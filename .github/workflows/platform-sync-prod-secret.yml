name: Platform Sync Prod Secret

on:
  workflow_dispatch:
    inputs:
      claudeoffice_base_url:
        description: 'CLAUDEOFFICE_BASE_URL'
        required: true
        default: 'https://claudeoffice.com'
        type: string
      claudeoffice_auth_key:
        description: '可选：覆盖 CLAUDEOFFICE_AUTH_KEY；留空则保持现有值'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  sync_secret:
    name: Sync officecli-platform-env
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ vars.PLATFORM_SERVER_HOST || '18.141.191.80' }}
      SERVER_USER: ${{ vars.PLATFORM_SERVER_USER || 'ubuntu' }}
      SSH_PORT: ${{ vars.PLATFORM_SSH_PORT || '22' }}
      KUBE_NAMESPACE: ${{ vars.PLATFORM_KUBE_NAMESPACE || 'officecli' }}
      SECRET_NAME: ${{ vars.PLATFORM_SECRET_NAME || 'officecli-platform-env' }}
      CLAUDEOFFICE_BASE_URL: ${{ inputs.claudeoffice_base_url }}
      CLAUDEOFFICE_AUTH_KEY: ${{ inputs.claudeoffice_auth_key }}
    steps:
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PLATFORM_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PLATFORM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "${SSH_KNOWN_HOSTS}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${SSH_PORT}" "${SERVER_HOST}" >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Patch production secret
        run: |
          set -euo pipefail
          ssh -p "${SSH_PORT}" "${SERVER_USER}@${SERVER_HOST}" \
            KUBE_NAMESPACE="${KUBE_NAMESPACE}" \
            SECRET_NAME="${SECRET_NAME}" \
            CLAUDEOFFICE_BASE_URL="${CLAUDEOFFICE_BASE_URL}" \
            CLAUDEOFFICE_AUTH_KEY="${CLAUDEOFFICE_AUTH_KEY}" \
            'bash -se' <<'EOF'
          set -euo pipefail
          kubectl -n "${KUBE_NAMESPACE}" get secret "${SECRET_NAME}" >/dev/null
          if [ -n "${CLAUDEOFFICE_AUTH_KEY}" ]; then
            kubectl -n "${KUBE_NAMESPACE}" patch secret "${SECRET_NAME}" --type merge -p "{\"stringData\":{\"CLAUDEOFFICE_BASE_URL\":\"${CLAUDEOFFICE_BASE_URL}\",\"CLAUDEOFFICE_AUTH_KEY\":\"${CLAUDEOFFICE_AUTH_KEY}\"}}"
          else
            kubectl -n "${KUBE_NAMESPACE}" patch secret "${SECRET_NAME}" --type merge -p "{\"stringData\":{\"CLAUDEOFFICE_BASE_URL\":\"${CLAUDEOFFICE_BASE_URL}\"}}"
          fi
          kubectl -n "${KUBE_NAMESPACE}" get secret "${SECRET_NAME}" -o jsonpath='{.data.CLAUDEOFFICE_BASE_URL}' | base64 -d
          echo
          EOF
