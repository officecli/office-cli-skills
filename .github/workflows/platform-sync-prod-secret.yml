name: Platform Sync Prod Secret

on:
  workflow_dispatch:
    inputs:
      claudeoffice_base_url:
        description: 'CLAUDEOFFICE_BASE_URL'
        required: true
        default: 'https://claudeoffice.com'
        type: string
      claudeoffice_auth_key_id:
        description: '可选：覆盖 CLAUDEOFFICE_AUTH_KEY_ID；留空则保持现有值或默认 platform-prod'
        required: false
        default: 'platform-prod'
        type: string
      claudeoffice_auth_shared_secret:
        description: '可选：覆盖 CLAUDEOFFICE_AUTH_SHARED_SECRET；留空则保持现有值'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  sync_secret:
    name: Sync officecli-platform-env
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ vars.PLATFORM_SERVER_HOST || '18.141.191.80' }}
      SERVER_USER: ${{ vars.PLATFORM_SERVER_USER || 'ubuntu' }}
      SSH_PORT: ${{ vars.PLATFORM_SSH_PORT || '22' }}
      KUBE_NAMESPACE: ${{ vars.PLATFORM_KUBE_NAMESPACE || 'officecli' }}
      SECRET_NAME: ${{ vars.PLATFORM_SECRET_NAME || 'officecli-platform-env' }}
      CLAUDEOFFICE_BASE_URL: ${{ inputs.claudeoffice_base_url }}
      CLAUDEOFFICE_AUTH_KEY_ID: ${{ inputs.claudeoffice_auth_key_id || vars.PLATFORM_CLAUDEOFFICE_AUTH_KEY_ID || 'platform-prod' }}
      CLAUDEOFFICE_AUTH_SHARED_SECRET: ${{ inputs.claudeoffice_auth_shared_secret }}
    steps:
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PLATFORM_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PLATFORM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "${SSH_KNOWN_HOSTS}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${SSH_PORT}" "${SERVER_HOST}" >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Patch production secret
        run: |
          set -euo pipefail
          ssh -p "${SSH_PORT}" "${SERVER_USER}@${SERVER_HOST}" \
            KUBE_NAMESPACE="${KUBE_NAMESPACE}" \
            SECRET_NAME="${SECRET_NAME}" \
            CLAUDEOFFICE_BASE_URL="${CLAUDEOFFICE_BASE_URL}" \
            CLAUDEOFFICE_AUTH_KEY_ID="${CLAUDEOFFICE_AUTH_KEY_ID}" \
            CLAUDEOFFICE_AUTH_SHARED_SECRET="${CLAUDEOFFICE_AUTH_SHARED_SECRET}" \
            'bash -se' <<'EOF'
          set -euo pipefail
          kubectl -n "${KUBE_NAMESPACE}" get secret "${SECRET_NAME}" >/dev/null
          payload="$(python3 - <<'PY'
import json
import os

data = {"CLAUDEOFFICE_BASE_URL": os.environ["CLAUDEOFFICE_BASE_URL"]}
key_id = os.environ.get("CLAUDEOFFICE_AUTH_KEY_ID", "").strip()
shared_secret = os.environ.get("CLAUDEOFFICE_AUTH_SHARED_SECRET", "").strip()
if key_id:
    data["CLAUDEOFFICE_AUTH_KEY_ID"] = key_id
if shared_secret:
    data["CLAUDEOFFICE_AUTH_SHARED_SECRET"] = shared_secret
print(json.dumps({"stringData": data}, ensure_ascii=False))
PY
)"
          kubectl -n "${KUBE_NAMESPACE}" patch secret "${SECRET_NAME}" --type merge -p "${payload}"
          kubectl -n "${KUBE_NAMESPACE}" get secret "${SECRET_NAME}" -o jsonpath='{.data.CLAUDEOFFICE_BASE_URL}' | base64 -d
          echo
          EOF
