name: Sync Public Skills

on:
  workflow_dispatch:

concurrency:
  group: sync-public-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync Skills To Public Repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUBLIC_SKILLS_REPO: ${{ vars.PUBLIC_SKILLS_REPO }}
      PUBLIC_SKILLS_DEFAULT_BRANCH: ${{ vars.PUBLIC_SKILLS_DEFAULT_BRANCH || 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync public skills repository
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_SKILLS_REPO_TOKEN }}
        run: bash ./scripts/sync-public-skills-repo.sh
