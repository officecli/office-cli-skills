name: CLI Installed E2E

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      install_source:
        description: 'Install source: released dist binary or current repository build'
        required: false
        default: current_build
        type: choice
        options:
          - current_build
          - release
      version:
        description: 'Release tag to install, e.g. v1.2.3 or latest'
        required: false
        default: latest
        type: string
      suite:
        description: 'Evaluation suite'
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - full

concurrency:
  group: cli-installed-e2e-${{ github.event.schedule || inputs.install_source || vars.CLI_INSTALLED_E2E_INSTALL_SOURCE || inputs.version || github.run_id }}
  cancel-in-progress: false

jobs:
  installed_e2e:
    name: Install And Evaluate OfficeCLI
    if: ${{ github.event_name == 'workflow_dispatch' || vars.CLI_INSTALLED_E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      DIST_REPO: ${{ vars.CLI_E2E_DIST_REPO || 'officecli/officecli-dist' }}
      INSTALL_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.install_source || vars.CLI_INSTALLED_E2E_INSTALL_SOURCE || 'current_build' }}
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || vars.CLI_INSTALLED_E2E_DEFAULT_VERSION || 'latest' }}
      SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || vars.CLI_INSTALLED_E2E_DEFAULT_SUITE || 'smoke' }}
      REPORT_ROOT: ${{ github.workspace }}/.tmp/cli-installed-e2e
      OFFICE_CLI_LLM_BASE_URL: ${{ secrets.OFFICE_CLI_LLM_BASE_URL }}
      OFFICE_CLI_LLM_API_KEY: ${{ secrets.OFFICE_CLI_LLM_API_KEY }}
      OFFICE_CLI_LLM_MODEL: ${{ vars.OFFICE_CLI_LLM_MODEL || 'gpt-4.1' }}
      OFFICE_CLI_LLM_REVIEW_MODEL: ${{ vars.OFFICE_CLI_LLM_REVIEW_MODEL || 'gpt-5.4-mini' }}
      OFFICE_CLI_LICENSE_BASE_URL: ${{ vars.OFFICE_CLI_LICENSE_BASE_URL || 'https://platform.officecli.io' }}
      OFFICE_CLI_LICENSE_API_KEY: ${{ secrets.OFFICE_CLI_LICENSE_API_KEY }}
      OFFICE_CLI_LICENSE_ENABLED: 'true'
      OFFICE_CLI_PUBLISH_BASE_URL: ${{ secrets.OFFICE_CLI_PUBLISH_BASE_URL }}
      OFFICE_CLI_PUBLISH_API_KEY: ${{ secrets.OFFICE_CLI_PUBLISH_API_KEY }}
      OFFICE_CLI_PUBLISH_PROVIDER: http
      OFFICE_CLI_PUBLISH_ENABLED: 'true'
      OFFICE_CLI_DEFAULT_PUBLISH: 'true'
      OFFICE_CLI_MODE: fast
    outputs:
      report_dir: ${{ steps.eval.outputs.report_dir }}
      installed_version: ${{ steps.install.outputs.installed_version }}
      suite: ${{ steps.meta.outputs.suite }}
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates \
            curl \
            git \
            golang-go \
            jq \
            python3 \
            tar \
            libreoffice-impress \
            fonts-noto-cjk \
            fonts-noto-color-emoji

      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Resolve run metadata
        id: meta
        run: |
          run_date="$(date -u +%F)"
          stamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          round_name="${SUITE}-${stamp}"
          report_dir="${GITHUB_WORKSPACE}/output/evals/${run_date}/${round_name}"
          mkdir -p "${report_dir}"
          echo "run_date=${run_date}" >> "$GITHUB_OUTPUT"
          echo "stamp=${stamp}" >> "$GITHUB_OUTPUT"
          echo "round_name=${round_name}" >> "$GITHUB_OUTPUT"
          echo "report_dir=${report_dir}" >> "$GITHUB_OUTPUT"
          echo "suite=${SUITE}" >> "$GITHUB_OUTPUT"

      - name: Install officecli
        id: install
        run: |
          mkdir -p /usr/local/bin
          if [ "${INSTALL_SOURCE}" = "current_build" ]; then
            short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
            build_version="current-${short_sha}"
            build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            go build \
              -ldflags "-X github.com/officecli/officecli/internal/cli.Version=${build_version} -X github.com/officecli/officecli/internal/cli.Commit=${short_sha} -X github.com/officecli/officecli/internal/cli.BuildDate=${build_date}" \
              -o /usr/local/bin/officecli ./cmd/officecli
            chmod +x /usr/local/bin/officecli
          else
            DIST_REPO="${DIST_REPO}" VERSION="${VERSION}" INSTALL_DIR="/usr/local/bin" bash ./scripts/install-officecli.sh
          fi
          installed_version="$(officecli --version | grep -Eo 'v?[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          if [ -z "${installed_version}" ]; then
            installed_version="$(officecli --version | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-120)"
          fi
          echo "installed_version=${installed_version}" >> "$GITHUB_OUTPUT"
          echo "install_source=${INSTALL_SOURCE}" >> "$GITHUB_OUTPUT"

      - name: Run installed CLI evaluation
        id: eval
        run: |
          set +e
          python3 ./scripts/eval_ppt_quality.py \
            --root . \
            --bin "officecli" \
            --suite "${SUITE}" \
            --publish \
            --date "${{ steps.meta.outputs.run_date }}" \
            --round "${{ steps.meta.outputs.round_name }}" \
            --version-label "${{ steps.install.outputs.installed_version }}"
          exit_code=$?
          report_dir="${{ steps.meta.outputs.report_dir }}"
          if [ -z "${report_dir}" ]; then
            echo "report dir not found" >&2
            exit 1
          fi
          echo "report_dir=${report_dir}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Ensure fallback evaluation artifact
        if: always()
        env:
          REPORT_DIR: ${{ steps.meta.outputs.report_dir }}
          INSTALL_SOURCE: ${{ env.INSTALL_SOURCE }}
          VERSION: ${{ env.VERSION }}
          SUITE: ${{ steps.meta.outputs.suite }}
          INSTALL_CONCLUSION: ${{ steps.install.conclusion }}
          EVAL_CONCLUSION: ${{ steps.eval.conclusion }}
        run: |
          mkdir -p "${REPORT_DIR}"
          if [ -f "${REPORT_DIR}/summary.md" ] || [ -f "${REPORT_DIR}/blocked.json" ]; then
            exit 0
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report_dir = Path(os.environ["REPORT_DIR"])
          payload = {
              "status": "blocked",
              "suite": os.environ.get("SUITE") or "unknown",
              "installed_version": os.environ.get("VERSION") or "unknown",
              "message": "评测未完成，未生成标准报告。",
              "details": "install_source={}; install_step={}; eval_step={}".format(
                  os.environ.get("INSTALL_SOURCE") or "unknown",
                  os.environ.get("INSTALL_CONCLUSION") or "unknown",
                  os.environ.get("EVAL_CONCLUSION") or "unknown",
              ),
          }
          (report_dir / "blocked.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Append evaluation summary
        if: always()
        run: |
          if [ -f "${{ steps.meta.outputs.report_dir }}/summary.md" ]; then
            cat "${{ steps.meta.outputs.report_dir }}/summary.md" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f "${{ steps.meta.outputs.report_dir }}/blocked.json" ]; then
            REPORT_DIR="${{ steps.meta.outputs.report_dir }}" python3 -c 'import json, os; from pathlib import Path; path = Path(os.environ["REPORT_DIR"]) / "blocked.json"; payload = json.loads(path.read_text(encoding="utf-8")); print("# PPT 质量评测阻塞"); print(); print("- 套件：{}".format(payload.get("suite", "unknown"))); print("- 安装版本：{}".format(payload.get("installed_version", "unknown"))); print("- 原因：{}".format(payload.get("message", "-"))); details = (payload.get("details") or "").strip(); print("- 详情：{}".format(details)) if details else None' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "evaluation summary missing" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evaluation artifact
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: cli-installed-e2e-report
          path: ${{ steps.meta.outputs.report_dir }}
          if-no-files-found: error

      - name: Fail job when evaluation failed
        if: steps.eval.outputs.exit_code != '0'
        run: exit 1

  notify:
    name: Notify Email And DingTalk
    runs-on: ubuntu-latest
    needs:
      - installed_e2e
    if: ${{ always() && needs.installed_e2e.result != 'skipped' }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      CLI_E2E_EMAIL_SMTP_HOST: ${{ secrets.CLI_E2E_EMAIL_SMTP_HOST }}
      CLI_E2E_EMAIL_SMTP_PORT: ${{ vars.CLI_E2E_EMAIL_SMTP_PORT || '587' }}
      CLI_E2E_EMAIL_SMTP_USERNAME: ${{ secrets.CLI_E2E_EMAIL_SMTP_USERNAME }}
      CLI_E2E_EMAIL_SMTP_PASSWORD: ${{ secrets.CLI_E2E_EMAIL_SMTP_PASSWORD }}
      CLI_E2E_EMAIL_FROM: ${{ vars.CLI_E2E_EMAIL_FROM }}
      CLI_E2E_EMAIL_TO: ${{ vars.CLI_E2E_EMAIL_TO }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Download evaluation artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: cli-installed-e2e-report
          path: ${{ runner.temp }}/cli-installed-e2e-report

      - name: Send notifications
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 ./scripts/notify-cli-e2e.py "${RUNNER_TEMP}/cli-installed-e2e-report"
