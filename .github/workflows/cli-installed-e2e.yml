name: CLI Installed E2E

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      install_source:
        description: 'Install source: released dist binary or current repository build'
        required: false
        default: current_build
        type: choice
        options:
          - current_build
          - release
      license_mode:
        description: 'License mode: free trial quota or paid API key'
        required: false
        default: free
        type: choice
        options:
          - free
          - paid
      version:
        description: 'Release tag to install, e.g. v1.2.3 or latest'
        required: false
        default: latest
        type: string
      suite:
        description: 'Evaluation suite'
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - full

concurrency:
  group: cli-installed-e2e-${{ github.event.schedule || inputs.install_source || vars.CLI_INSTALLED_E2E_INSTALL_SOURCE || inputs.license_mode || vars.CLI_INSTALLED_E2E_LICENSE_MODE || inputs.version || github.run_id }}
  cancel-in-progress: false

jobs:
  installed_e2e:
    name: Install And Evaluate OfficeCLI
    if: ${{ github.event_name == 'workflow_dispatch' || vars.CLI_INSTALLED_E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      DIST_REPO: ${{ vars.CLI_E2E_DIST_REPO || 'officecli/officecli-dist' }}
      INSTALL_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.install_source || vars.CLI_INSTALLED_E2E_INSTALL_SOURCE || 'current_build' }}
      LICENSE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.license_mode || vars.CLI_INSTALLED_E2E_LICENSE_MODE || 'free' }}
      FINGERPRINT_SEED: ${{ vars.CLI_INSTALLED_E2E_FINGERPRINT_SEED || 'officecli-cli-installed-e2e' }}
      EVAL_RETRY_MAX_ATTEMPTS: ${{ vars.CLI_INSTALLED_E2E_RETRY_MAX_ATTEMPTS || '3' }}
      EVAL_RETRY_SLEEP_SECONDS: ${{ vars.CLI_INSTALLED_E2E_RETRY_SLEEP_SECONDS || '20' }}
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || vars.CLI_INSTALLED_E2E_DEFAULT_VERSION || 'latest' }}
      SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || vars.CLI_INSTALLED_E2E_DEFAULT_SUITE || 'smoke' }}
      REPORT_ROOT: ${{ github.workspace }}/.tmp/cli-installed-e2e
      OFFICE_CLI_LLM_BASE_URL: ${{ secrets.OFFICE_CLI_LLM_BASE_URL }}
      OFFICE_CLI_LLM_API_KEY: ${{ secrets.OFFICE_CLI_LLM_API_KEY }}
      OFFICE_CLI_LLM_MODEL: ${{ vars.OFFICE_CLI_LLM_MODEL || 'gpt-4.1' }}
      OFFICE_CLI_LLM_REVIEW_MODEL: ${{ vars.OFFICE_CLI_LLM_REVIEW_MODEL || 'gpt-5.4-mini' }}
      OFFICE_CLI_LLM_TIMEOUT_SEC: ${{ vars.CLI_INSTALLED_E2E_LLM_TIMEOUT_SEC || '180' }}
      OFFICE_CLI_LICENSE_BASE_URL: ${{ vars.OFFICE_CLI_LICENSE_BASE_URL || 'https://platform.officecli.io' }}
      OFFICE_CLI_LICENSE_ENABLED: 'true'
      OFFICE_CLI_PUBLISH_BASE_URL: ${{ vars.OFFICE_CLI_PUBLISH_BASE_URL || 'https://platform.officecli.io/api' }}
      OFFICE_CLI_PUBLISH_API_KEY: ${{ secrets.OFFICE_CLI_PUBLISH_API_KEY || secrets.OFFICE_CLI_LICENSE_API_KEY }}
      OFFICE_CLI_PUBLISH_PROVIDER: http
      OFFICE_CLI_PUBLISH_ENABLED: 'true'
      OFFICE_CLI_DEFAULT_PUBLISH: 'true'
      OFFICE_CLI_MODE: fast
    outputs:
      report_dir: ${{ steps.eval.outputs.report_dir }}
      installed_version: ${{ steps.install.outputs.installed_version }}
      suite: ${{ steps.meta.outputs.suite }}
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates \
            curl \
            git \
            golang-go \
            jq \
            python3 \
            tar \
            libreoffice-impress \
            fonts-noto-cjk \
            fonts-noto-color-emoji

      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Resolve run metadata
        id: meta
        run: |
          run_date="$(date -u +%F)"
          stamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          round_name="${SUITE}-${stamp}"
          report_dir="${GITHUB_WORKSPACE}/output/evals/${run_date}/${round_name}"
          machine_id="${FINGERPRINT_SEED}-${run_date}"
          mkdir -p "${report_dir}"
          echo "run_date=${run_date}" >> "$GITHUB_OUTPUT"
          echo "stamp=${stamp}" >> "$GITHUB_OUTPUT"
          echo "round_name=${round_name}" >> "$GITHUB_OUTPUT"
          echo "report_dir=${report_dir}" >> "$GITHUB_OUTPUT"
          echo "machine_id=${machine_id}" >> "$GITHUB_OUTPUT"
          echo "suite=${SUITE}" >> "$GITHUB_OUTPUT"

      - name: Install officecli
        id: install
        env:
          CLI_EMBEDDED_PUBLISH_BASE_URL: ${{ vars.CLI_EMBEDDED_PUBLISH_BASE_URL || 'https://claudeoffice.com' }}
          CLI_EMBEDDED_PUBLISH_AUTH_KEY_ID: ${{ vars.CLI_EMBEDDED_PUBLISH_AUTH_KEY_ID || 'officecli-cli' }}
          CLI_EMBEDDED_PUBLISH_AUTH_KEY: ${{ secrets.CLI_EMBEDDED_PUBLISH_AUTH_KEY || '' }}
        run: |
          mkdir -p /usr/local/bin
          if [ "${INSTALL_SOURCE}" = "current_build" ]; then
            short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
            build_version="current-${short_sha}"
            build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            go build \
              -buildvcs=false \
              -ldflags "-X github.com/officecli/officecli/internal/cli.Version=${build_version} -X github.com/officecli/officecli/internal/cli.Commit=${short_sha} -X github.com/officecli/officecli/internal/cli.BuildDate=${build_date} -X github.com/officecli/officecli/internal/providers/publish.EmbeddedPublishBaseURL=${CLI_EMBEDDED_PUBLISH_BASE_URL} -X github.com/officecli/officecli/internal/providers/publish.EmbeddedPublishAuthKeyID=${CLI_EMBEDDED_PUBLISH_AUTH_KEY_ID} -X github.com/officecli/officecli/internal/providers/publish.EmbeddedPublishAuthKey=${CLI_EMBEDDED_PUBLISH_AUTH_KEY}" \
              -o /usr/local/bin/officecli ./cmd/officecli
            chmod +x /usr/local/bin/officecli
          else
            DIST_REPO="${DIST_REPO}" VERSION="${VERSION}" INSTALL_DIR="/usr/local/bin" bash ./scripts/install-officecli.sh
          fi
          installed_version="$(officecli --version | grep -Eo 'v?[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          if [ -z "${installed_version}" ]; then
            installed_version="$(officecli --version | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | cut -c1-120)"
          fi
          echo "installed_version=${installed_version}" >> "$GITHUB_OUTPUT"
          echo "install_source=${INSTALL_SOURCE}" >> "$GITHUB_OUTPUT"

      - name: Run installed CLI evaluation
        id: eval
        env:
          OFFICE_CLI_LICENSE_API_KEY: ${{ env.LICENSE_MODE == 'paid' && secrets.OFFICE_CLI_LICENSE_API_KEY || '' }}
          OFFICE_CLI_MACHINE_ID: ${{ steps.meta.outputs.machine_id }}
        run: |
          set +e
          report_dir="${{ steps.meta.outputs.report_dir }}"
          max_attempts="${EVAL_RETRY_MAX_ATTEMPTS}"
          sleep_seconds="${EVAL_RETRY_SLEEP_SECONDS}"
          attempt=1
          exit_code=1
          retry_reason=""
          while [ "${attempt}" -le "${max_attempts}" ]; do
            rm -f "${report_dir}/blocked.json" "${report_dir}/summary.json" "${report_dir}/summary.md"
            python3 ./scripts/eval_ppt_quality.py \
              --root . \
              --bin "officecli" \
              --suite "${SUITE}" \
              --publish \
              --date "${{ steps.meta.outputs.run_date }}" \
              --round "${{ steps.meta.outputs.round_name }}" \
              --version-label "${{ steps.install.outputs.installed_version }}"
            exit_code=$?
            if [ "${exit_code}" = "0" ]; then
              break
            fi
            retry_reason="$(REPORT_DIR="${report_dir}" python3 -c 'import json, os; from pathlib import Path; path = Path(os.environ["REPORT_DIR"]) / "blocked.json"; payload = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}; details = (payload.get("details") or "").strip(); lower = details.lower(); retryable = "yes" if ("status=502" in lower or "502 bad gateway" in lower or "gateway timeout" in lower or "upstream prematurely closed connection" in lower or "context deadline exceeded" in lower or "client.timeout exceeded" in lower or "timeout exceeded while awaiting headers" in lower or "i/o timeout" in lower) else "no"; print(retryable + "|" + details.replace("\n", " "))')"
            retryable="${retry_reason%%|*}"
            retry_detail="${retry_reason#*|}"
            if [ "${retryable}" != "yes" ] || [ "${attempt}" -ge "${max_attempts}" ]; then
              break
            fi
            echo "retryable platform error on attempt ${attempt}/${max_attempts}: ${retry_detail}"
            sleep "${sleep_seconds}"
            attempt=$((attempt + 1))
          done
          if [ -z "${report_dir}" ]; then
            echo "report dir not found" >&2
            exit 1
          fi
          echo "report_dir=${report_dir}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          echo "attempts=${attempt}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Ensure fallback evaluation artifact
        if: always()
        env:
          REPORT_DIR: ${{ steps.meta.outputs.report_dir }}
          INSTALL_SOURCE: ${{ env.INSTALL_SOURCE }}
          LICENSE_MODE: ${{ env.LICENSE_MODE }}
          MACHINE_ID: ${{ steps.meta.outputs.machine_id }}
          VERSION: ${{ env.VERSION }}
          SUITE: ${{ steps.meta.outputs.suite }}
          INSTALL_CONCLUSION: ${{ steps.install.conclusion }}
          EVAL_CONCLUSION: ${{ steps.eval.conclusion }}
        run: |
          mkdir -p "${REPORT_DIR}"
          if [ -f "${REPORT_DIR}/summary.md" ] || [ -f "${REPORT_DIR}/blocked.json" ]; then
            exit 0
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report_dir = Path(os.environ["REPORT_DIR"])
          payload = {
              "status": "blocked",
              "suite": os.environ.get("SUITE") or "unknown",
              "installed_version": os.environ.get("VERSION") or "unknown",
              "message": "Evaluation did not complete, so no standard report was produced.",
              "details": "install_source={}; license_mode={}; machine_id={}; install_step={}; eval_step={}".format(
                  os.environ.get("INSTALL_SOURCE") or "unknown",
                  os.environ.get("LICENSE_MODE") or "unknown",
                  os.environ.get("MACHINE_ID") or "unknown",
                  os.environ.get("INSTALL_CONCLUSION") or "unknown",
                  os.environ.get("EVAL_CONCLUSION") or "unknown",
              ),
          }
          (report_dir / "blocked.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Append evaluation summary
        if: always()
        run: |
          if [ -f "${{ steps.meta.outputs.report_dir }}/summary.md" ]; then
            cat "${{ steps.meta.outputs.report_dir }}/summary.md" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f "${{ steps.meta.outputs.report_dir }}/blocked.json" ]; then
            REPORT_DIR="${{ steps.meta.outputs.report_dir }}" python3 -c 'import json, os; from pathlib import Path; path = Path(os.environ["REPORT_DIR"]) / "blocked.json"; payload = json.loads(path.read_text(encoding="utf-8")); print("# PPT Quality Evaluation Blocked"); print(); print("- Suite: {}".format(payload.get("suite", "unknown"))); print("- Installed version: {}".format(payload.get("installed_version", "unknown"))); print("- Reason: {}".format(payload.get("message", "-"))); details = (payload.get("details") or "").strip(); print("- Details: {}".format(details)) if details else None' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "evaluation summary missing" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evaluation artifact
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: cli-installed-e2e-report
          path: ${{ steps.meta.outputs.report_dir }}
          if-no-files-found: error

      - name: Fail job when evaluation failed
        if: steps.eval.outputs.exit_code != '0'
        run: exit 1

  notify:
    name: Notify Email And DingTalk
    runs-on: ubuntu-latest
    needs:
      - installed_e2e
    if: ${{ always() && needs.installed_e2e.result != 'skipped' }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      CLI_E2E_EMAIL_SMTP_HOST: ${{ secrets.CLI_E2E_EMAIL_SMTP_HOST }}
      CLI_E2E_EMAIL_SMTP_PORT: ${{ vars.CLI_E2E_EMAIL_SMTP_PORT || '587' }}
      CLI_E2E_EMAIL_SMTP_USERNAME: ${{ secrets.CLI_E2E_EMAIL_SMTP_USERNAME }}
      CLI_E2E_EMAIL_SMTP_PASSWORD: ${{ secrets.CLI_E2E_EMAIL_SMTP_PASSWORD }}
      CLI_E2E_EMAIL_FROM: ${{ vars.CLI_E2E_EMAIL_FROM }}
      CLI_E2E_EMAIL_TO: ${{ vars.CLI_E2E_EMAIL_TO }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Download evaluation artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: cli-installed-e2e-report
          path: ${{ runner.temp }}/cli-installed-e2e-report

      - name: Send notifications
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 ./scripts/notify-cli-e2e.py "${RUNNER_TEMP}/cli-installed-e2e-report"
