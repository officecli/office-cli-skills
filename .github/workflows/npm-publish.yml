name: NPM Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to publish, for example v0.2.5"
        required: true
        type: string
      dist_repo:
        description: "Public dist repository"
        required: false
        default: "officecli/officecli-dist"
        type: string

concurrency:
  group: npm-publish-${{ github.ref || inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish Wrapper To NPM
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
      DIST_REPO: ${{ github.event_name == 'workflow_dispatch' && inputs.dist_repo || vars.PUBLIC_DIST_REPO || 'officecli/officecli-dist' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Validate release tag exists for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch --tags --force
          git rev-parse "${RELEASE_TAG}^{commit}" >/dev/null 2>&1

      - name: Ensure public dist release exists
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_DIST_REPO_TOKEN || github.token }}
        run: |
          gh release view "${RELEASE_TAG}" -R "${DIST_REPO}" >/dev/null

      - name: Check wrapper version
        working-directory: packages/npm/officecli
        run: npm run check:release-version

      - name: Pack wrapper
        working-directory: packages/npm/officecli
        run: npm pack

      - name: Publish wrapper
        working-directory: packages/npm/officecli
        run: npm publish --access public
